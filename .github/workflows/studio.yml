# Builds the Windows desktop app (Studio): ShortsAutopilotStudio-Setup.exe
# Download it from the run's "Artifacts" section (or from Releases when you push a tag like studio-v1.0.0).
name: studio-windows
on:
  push:
    # Listing only `tags` would silently skip branch pushes — list both.
    branches: ["**"]
    tags: ["studio-v*"]
    paths: ["studio/**", "worker/**", "src/**", "package.json", "next.config.ts", ".github/workflows/studio.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies (also fetches the Windows ffmpeg.exe)
        run: npm ci
      - name: Build single-file exe (Node SEA) + resources + bundled app ("Run everything on this PC")
        env:
          BUNDLE_FFMPEG: "1"
          BUNDLE_APP: "1"
        run: node studio/build.mjs
      - name: Bundle uv (installs Python for the user automatically)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvtmp
          Copy-Item (Get-ChildItem uvtmp -Recurse -Filter uv.exe | Select-Object -First 1).FullName dist/studio/resources/bin/uv.exe
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $env:STUDIO_NO_BROWSER = "1"; $env:STUDIO_PORT = "7799"; $env:STUDIO_HOME = "$env:RUNNER_TEMP\studio"
          $p = Start-Process dist/studio/ShortsStudio.exe -PassThru
          Start-Sleep 6
          $html = (Invoke-WebRequest http://127.0.0.1:7799/ -UseBasicParsing).Content
          if ($html -notmatch "Autopilot Studio") { throw "UI not served" }
          $tok = [regex]::Match($html, 'const T = "([a-f0-9]+)"').Groups[1].Value
          $h = @{ "x-studio-token" = $tok }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:7799/api/factory -Headers $h -ContentType "application/json" -Body '{"action":"start"}' | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:3100/api/me -UseBasicParsing -SkipHttpErrorCheck; if ($r.StatusCode -in 200, 401) { $ok = $true; break } } catch {}
          }
          $f = Invoke-RestMethod -Uri http://127.0.0.1:7799/api/factory -Headers $h
          $f.log -join "`n"
          if (-not $ok) { throw "bundled app server did not start" }
          $login = @{ email = $f.login.email; password = $f.login.password } | ConvertTo-Json
          # The session cookie is Secure (browsers accept that on 127.0.0.1; PowerShell's cookie jar does not), so pass it by hand.
          $lr = Invoke-WebRequest -Method Post -Uri http://127.0.0.1:3100/api/auth/login -ContentType "application/json" -Body $login -UseBasicParsing
          $cookie = (($lr.Headers["Set-Cookie"] | Select-Object -First 1) -split ";")[0]
          $health = Invoke-RestMethod -Uri http://127.0.0.1:3100/api/health -Headers @{ Cookie = $cookie }
          $health.checks | Format-Table name, ok, detail -AutoSize | Out-String -Width 200
          $ff = $health.checks | Where-Object { $_.name -like "Video engine*" }
          if (-not $ff.ok) { throw "ffmpeg render failed in the bundled app: $($ff.detail)" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:7799/api/factory -Headers $h -ContentType "application/json" -Body '{"action":"stop"}' | Out-Null
          Stop-Process $p.Id
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:STUDIO_VERSION = if ($env:GITHUB_REF_NAME -like "studio-v*") { $env:GITHUB_REF_NAME.Substring(8) } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" studio\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsAutopilotStudio-Setup
          path: dist/ShortsAutopilotStudio-Setup.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShortsAutopilotStudio-Setup.exe
